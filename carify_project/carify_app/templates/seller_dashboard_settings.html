{% extends 'seller_base.html' %}
{% block title %}Partner Protocol | Carify Partner{% endblock %}

{% block content %}
<div class="section-header">
    <h1 class="section-title">Partner Settings</h1>
</div>

<div class="content-section" style="max-width: 800px;">
    <h2 class="section-title">Global Partner Protocol</h2>
    <form method="POST" enctype="multipart/form-data" style="margin-top: 30px; display: flex; flex-direction: column; gap: 20px;">
        {% csrf_token %}
        
        <div class="form-group">
            <label style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; display: block; margin-bottom: 8px;">Shop Name</label>
            {{ form.shop_name }}
        </div>

        <div class="form-group">
            <label style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; display: block; margin-bottom: 8px;">Collection Description</label>
            {{ form.description }}
        </div>

        <div class="form-group">
            <label style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; display: block; margin-bottom: 8px;">Official Seal (Logo)</label>
            {% if profile.logo %}
                <div style="margin-bottom: 15px;">
                    <img src="{{ profile.logo.url }}" alt="Logo" style="height: 60px; border: 1px solid var(--border-subtle); border-radius: 4px;">
                </div>
            {% endif %}
            {{ form.logo }}
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary" style="width: 100%;">Finalize Protocol Updates</button>
        </div>
    </form>
</div>
{% endblock %}
